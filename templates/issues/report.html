{% extends "base.html" %}
{% block title %}Report Issue{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

    <!-- Header -->
    <div class="mb-6">
        <a href="{{ url_for('main.student_dashboard') }}"
            class="text-sm text-gray-400 hover:text-indigo-600 transition">← Back to Dashboard</a>
        <h2 class="text-2xl font-bold text-gray-800 mt-2">Report a Campus Issue</h2>
        <p class="text-sm text-gray-400 mt-1">Your identity will be protected from resolution handlers.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <form method="POST" enctype="multipart/form-data" class="space-y-5">

            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Issue Title</label>
                <input type="text" name="title" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    placeholder="e.g. Broken bench near library">
            </div>

            <!-- Category -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                <select name="category" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    <option value="" disabled selected>Select a category</option>
                    <option>Electrical</option>
                    <option>Plumbing</option>
                    <option>Cleanliness</option>
                    <option>Infrastructure</option>
                    <option>Internet / IT</option>
                    <option>Security</option>
                    <option>Furniture</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Location -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                <input type="text" name="location" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    placeholder="e.g. Block B, Room 204">
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea name="description" rows="4" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"
                    placeholder="Describe the issue in detail..."></textarea>
            </div>

            <!-- Photo Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Photo <span class="text-gray-400 font-normal">(optional)</span></label>
                <div class="border-2 border-dashed border-gray-200 rounded-xl p-6 text-center hover:border-indigo-400 transition cursor-pointer"
                    onclick="document.getElementById('photo').click()">
                    <input type="file" name="photo" id="photo" accept="image/*" class="hidden"
                        onchange="previewImage(event)">
                    <div id="upload-placeholder">
                        <p class="text-3xl mb-2">📷</p>
                        <p class="text-sm text-gray-400">Click to upload a photo</p>
                        <p class="text-xs text-gray-300 mt-1">PNG, JPG, GIF up to 5MB</p>
                    </div>
                    <img id="preview" src="#" alt="Preview"
                        class="hidden max-h-40 mx-auto rounded-lg mt-2">
                </div>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full bg-indigo-600 text-white py-3 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">
                Submit Issue Report
            </button>

        </form>
    </div>
</div>

<script>
function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('preview').src = e.target.result;
            document.getElementById('preview').classList.remove('hidden');
            document.getElementById('upload-placeholder').classList.add('hidden');
        };
        reader.readAsDataURL(file);
    }
}
</script>
{% endblock %}
